[project]
name = "hospital-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhinav", email = "abhinav.s@genrobotics.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-stubs>=6.0.9",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "mypy>=2.3.0",
    "paytm-pg>=1.1.2",
    "phonepe-pg-sdk-python>=2.3.0",
    "pytest>=9.1.1",
    "razorpay>=2.0.1",
    "ruff>=0.16.2",
]

[project.scripts]
hospital-management = "hospital_management:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
